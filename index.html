<!doctype html>
<html class="dark" data-theme="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Model Viewer</title>
  </head>
  <body class="bg-background text-foreground">
    <div class="viewer-app app-shell">
      <aside class="panel" id="side-menu"></aside>
      <main class="viewer-wrap">
        <div id="viewer" class="viewer"></div>
        <div class="axis-legend" aria-label="Axis legend">
          <span class="axis-chip axis-chip-x">X</span>
          <span class="axis-chip axis-chip-y">Y</span>
          <span class="axis-chip axis-chip-z">Z</span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
